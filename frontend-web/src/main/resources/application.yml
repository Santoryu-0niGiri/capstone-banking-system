server:
  port: 8090

spring:
  application:
    name: frontend-web
  thymeleaf:
    cache: false   # live-reload templates during development

banking:
  backend:
    # Mode can be 'mock' (default self-contained demo) or 'gateway' (live REST microservices via Spring Cloud Gateway)
    mode: mock
    gateway-url: http://localhost:8080
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
