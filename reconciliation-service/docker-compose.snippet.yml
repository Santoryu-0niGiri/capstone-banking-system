# Append this service under the `services:` key of your existing
# docker-compose.yml (the one that already runs accounts-service,
# Oracle XE, Redis, and Kafka) - not meant to be run standalone.
#
# Assumes a `postgres` service (the audit DB) also already exists in
# that same compose file, per the architecture doc's Postgres 15+
# audit layer.

  reconciliation-service:
    build: ./reconciliation-service
    container_name: reconciliation-service
    ports:
      - "8086:8086"
    environment:
      ORACLE_URL: jdbc:oracle:thin:@//oracle-xe:1521/XEPDB1
      ORACLE_USERNAME: recon_ro
      ORACLE_PASSWORD: changeme
      ORACLE_SCHEMA: LEDGER_APP
      PG_URL: jdbc:postgresql://postgres:5432/audit_db
      PG_USERNAME: recon_audit
      PG_PASSWORD: changeme
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - oracle-xe
      - postgres
      - kafka
    networks:
      - banking-net
