server:
  port: 8084

spring:
  application:
    name: transaction-service

  datasource:
    oracle:
      url: ${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
      username: ${ORACLE_USERNAME:ledger_app}
      password: ${ORACLE_PASSWORD:LedgerAppPass123}
      driver-class-name: oracle.jdbc.OracleDriver
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        maximum-pool-size: 30
        minimum-idle: 5
        connection-timeout: 30000
        pool-name: TransactionOracleHikariPool
    postgres:
      url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/ledger_audit}
      username: ${POSTGRES_USERNAME:ledger_audit}
      password: ${POSTGRES_PASSWORD:LedgerAuditPass123}
      driver-class-name: org.postgresql.Driver
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
        pool-name: TransactionPostgresHikariPool

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

jwt:
  secret: ${JWT_SECRET:CapstoneBankingSuperSecretSigningKeyMustBe256BitsLong!}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
<<<<<<< Updated upstream
    com.capstone: INFO
