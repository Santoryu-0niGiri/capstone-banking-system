
spring:
  cloud:
    gateway:
      routes:
        - id: registration-service
          uri: http://registration-service:8081
          predicates:
            - Path=/api/auth/register/**
        - id: login-service
          uri: http://login-service:8082
          predicates:
            - Path=/api/auth/login/**,/api/auth/logout/**
        - id: accounts-service
          uri: http://accounts-service:8083
          predicates:
            - Path=/api/accounts/**
          filters:
            - JwtAuthentication
        - id: transaction-service
          uri: http://transaction-service:8084
          predicates:
            - Path=/api/transactions/**
          filters:
            - JwtAuthentication

